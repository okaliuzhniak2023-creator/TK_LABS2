<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petworld</title>
    
    <!-- Підключення шрифтів та стилів -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mozilla+Headline:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Шапка (Header / Top Bar 1280px) -->
  <header class="header">
    <div class="container header-container">
      <a href="#" class="logo">
        <img src="assets/Logo illustration.svg" alt="Logo icon">
        <span class="logo-text">PETWORLD</span>
      </a>
      <div class="auth-buttons">
        <a href="#" class="btn-sign-up">Sign Up</a>
        <a href="#" class="btn-log-in">Log in</a>
      </div>
    </div>
  </header>

  <!-- Головна секція (Header 1280px / Hero) -->
  <section class="hero-section">
    <div class="container hero-container">
      <div class="hero-content">
        <div class="hero-text-block">
          <h1 class="hero-title">Pet Store<br>& Beyond</h1>
          <p class="hero-text">
            This is a sample landing page, created with Figma and Anima. No coding involved.
          </p>
        </div>
        <a href="#" class="btn-get-started">Get Started</a>
      </div>
      <div class="hero-image-wrapper">
        <img src="assets/dogImage.png" alt="Two dogs in stylish outfits" class="hero-img">
      </div>
    </div>
  </section>

  <!-- Секція Відео (Video 1280px) -->
  <section class="video-section">
    <div class="video-container">
      <div class="video-wrapper">
        <img src="assets/Video.png" alt="Video preview" class="video-img">
      </div>
    </div>
  </section>

</body>
</html>
