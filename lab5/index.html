<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPNU Header Shortcuts</title>
  <!-- Правильний шлях для вашої структури папок -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="hero_container" role="link" aria-label="Hero Image">
  <div class="region region-hero">
    
    <!-- Hero Banner -->
    <section class="views-element-container block block-views block-views-blockfront-page-news-block-1 clearfix" id="block-views-block-front-page-news-block-1">
      <div class="form-group">
        <div class="view view-front-page-news">
          <div class="view-content">
            <div id="hero">
              <div class="shadow"></div>
              <div class="container">
                <h2>
                  <a href="https://lpnu.ua/news/nataliia-shakhovska-osoblyva-misiia-osvitian-sohodni-ne-daty-viini-zupynyty-rozvytok-ukrainy" hreflang="uk">
                    "Наталія Шаховська: «Особлива місія освітян сьогодні — не дати війні зупинити розвиток України»"
                  </a>
                </h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Shortcuts Blue Navigation Bar -->
    <section id="block-lpnushortcutstop4" class="block block-block-content clearfix">
      <div class="field field--name-body field--item">
        <div class="shortcuts-wrapper">
          
          <!-- 1. Підготовчі курси (fa-info-circle) -->
          <a href="https://lpnu.ua/pidhotovchi-kursy" class="shortcut-item">
            <div class="shortcut-content">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 512 512">
                <path fill="currentColor" d="M256 8C119.043 8 8 119.083 8 256c0 136.997 111.043 248 248 248s248-111.003 248-248C504 119.083 392.957 8 256 8zm0 110c23.196 0 42 18.804 42 42s-18.804 42-42 42-42-18.804-42-42 18.804-42 42-42zm56 254c0 6.627-5.373 12-12 12h-88c-6.627 0-12-5.373-12-12v-24c0-6.627 5.373-12 12-12h12v-64h-12c-6.627 0-12-5.373-12-12v-24c0-6.627 5.373-12 12-12h64c6.627 0 12 5.373 12 12v100h12c6.627 0 12 5.373 12 12v24z"></path>
              </svg>
              <span>Підготовчі курси</span>
            </div>
          </a>

          <!-- 2. З ректорського столу (fa-university) -->
          <a href="https://lpnu.ua/reflections" class="shortcut-item">
            <div class="shortcut-content">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 512 512">
                <path fill="currentColor" d="M496 128v16a8 8 0 0 1-8 8h-24v12c0 6.627-5.373 12-12 12H60c-6.627 0-12-5.373-12-12v-12H24a8 8 0 0 1-8-8v-16a8 8 0 0 1 4.941-7.392l232-88a7.996 7.996 0 0 1 6.118 0l232 88A8 8 0 0 1 496 128zm-24 304H40c-13.255 0-24 10.745-24 24v16a8 8 0 0 0 8 8h464a8 8 0 0 0 8-8v-16c0-13.255-10.745-24-24-24zM96 192v192h60c-6.627 0-12 5.373-12 12v20h416v-20c0-6.627-5.373-12-12-12h-36V192h-64v192h-64V192h-64v192h-64V192h-64z"></path>
              </svg>
              <span>З ректорського столу</span>
            </div>
          </a>

          <!-- 3. Політехніки - для перемоги (fa-handshake) -->
          <a href="https://lpnu.ua/politekhniky-dlia-peremohy" class="shortcut-item">
            <div class="shortcut-content">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 640 512">
                <path fill="currentColor" d="M0 224c0 17.7 14.3 32 32 32h101.7l12.7 38.2c6.3 18.8 23.9 31.8 43.8 31.8h83.7c19.9 0 37.5-13 43.8-31.8l12.7-38.2H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H288v-32h80c17.7 0 32-14.3 32-32s-14.3-32-32-32H288V32c0-17.7-14.3-32-32-32s-32 14.3-32 32v64h-80c-17.7 0-32 14.3-32 32s14.3 32 32 32h80v32H32c-17.7 0-32 14.3-32 32zm624-96h-64c-17.7 0-32 14.3-32 32s14.3 32 32 32h64c8.8 0 16 7.2 16 16v224c0 8.8-7.2 16-16 16h-64c-17.7 0-32 14.3-32 32s14.3 32 32 32h64c44.2 0 80-35.8 80-80V208c0-44.2-35.8-80-80-80z"></path>
              </svg>
              <span>Політехніки - для перемоги</span>
            </div>
          </a>

          <!-- 4. Книга пам'яті (fa-users) -->
          <a href="https://lpnu.ua/knyha-pamiati" class="shortcut-item">
            <div class="shortcut-content">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 640 512">
                <path fill="currentColor" d="M96 224c35.3 0 64-28.7 64-64s-28.7-64-64-64-64 28.7-64 64 28.7 64 64 64zm32 32h-64c-17.6 0-33.5 7.1-45.1 18.6 40.3 22.1 68.9 62 75.1 109.4h66c17.7 0 32-14.3 32-32v-32c0-35.3-28.7-64-64-64zm256 0c61.9 0 112-50.1 112-112S446.1 32 384 32s-112 50.1-112 112 50.1 112 112zm76.8 32h-8.3c-20.8 10-43.9 16-68.5 16s-47.6-6-68.5-16h-8.3c-179.6 0-288 128-288 128v403.2v432c0 26.5 21.5 48 48 48h288c26.5 0 48-21.5 48-48v-28.8c0-51.6-115.2-115.2-115.2-115.2zm-223.7-13.4C161.5 263.1 145.6 256 128 256h64c-35.3 0-64 28.7-64 64v32 32h65.9c6.3-47.4 34.9-87.3 75.2-109.4z"></path>
              </svg>
              <span>Книга пам'яті</span>
            </div>
          </a>

        </div>
      </div>
    </section>

  </div>
</header>

</body>
</html>
